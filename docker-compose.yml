services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rivo-api:latest
    container_name: rivo-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
