spring.application.name=rivo-web-client
spring.jackson.default-property-inclusion=non_null
server.port=${SERVER_PORT_CLIENT:8022}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.danphe.rivo=${LOG_LEVEL_APP:INFO}
log.dir=${LOG_DIR:logs}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

spring.autoconfigure.exclude=org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

jwt.access-token.expiry-ms=${JWT_ACCESS_TOKEN_EXPIRY_MS:86400000}
jwt.refresh-token.expiry-ms=${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
session.cookie.secure=${SESSION_COOKIE_SECURE:false}

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.use-credentials=true
springdoc.swagger-ui.tags-sorter=alpha

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.schemas=${FLYWAY_SCHEMAS:client,system,public}
spring.flyway.default-schema=${FLYWAY_DEFAULT_SCHEMA:client}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}

spring.mail.host=${SPRING_MAIL_HOST:${EMAIL_HOST:${SMTP_HOST:}}}
spring.mail.port=${SPRING_MAIL_PORT:${EMAIL_PORT:${SMTP_PORT:587}}}
spring.mail.username=${SPRING_MAIL_USERNAME:${EMAIL_HOST_USER:${SMTP_USERNAME:}}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${EMAIL_HOST_PASSWORD:${SMTP_PASSWORD:}}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:${SMTP_AUTH:true}}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:${EMAIL_USE_TLS:${SMTP_STARTTLS_ENABLE:true}}}
